version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/db/queries
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        # Nullable columns become pointers so a missing statistic stays
        # distinguishable from a recorded zero all the way out to JSON.
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: date
            go_type: time.Time
          - db_type: date
            nullable: true
            go_type:
              type: time.Time
              pointer: true
