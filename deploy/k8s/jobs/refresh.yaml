# The refresh stage on its own: the derived columns and tables that every
# full load ends with -- the search ranking, the clutch and serve baselines,
# sets and games from every score, and player_totals, which the leaderboards
# and the year-by-year read. For once after a migration that adds one of
# them; a full load runs the same stage anyway.
#
#   kubectl -n deucepoint delete job refresh --ignore-not-found
#   kubectl -n deucepoint apply -f deploy/k8s/jobs/refresh.yaml
#   kubectl -n deucepoint logs -f job/refresh
#
# About a minute and a half on the full load: 51 seconds to derive 1.6
# million scores, 20 to sum the totals; the figures in docs/performance.md.
apiVersion: batch/v1
kind: Job
metadata:
  name: refresh
  namespace: deucepoint
  labels:
    app.kubernetes.io/name: refresh
    app.kubernetes.io/part-of: deucepoint
spec:
  # Each half is idempotent, so a retry redoes only what did not finish.
  backoffLimit: 2
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: refresh
        app.kubernetes.io/part-of: deucepoint
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: refresh
          image: ghcr.io/sami0076/tennis-wiki/tools@sha256:370ca334e30fd8b34677694bf0f42a69143a97e60deb92640d1d4996a5594116
          command: ["ingest", "--stage", "refresh"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: DATABASE_URL
            # The stage clears the read cache when it finishes, as every
            # stage does; a board is cached until the next one.
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: api
                  key: REDIS_URL
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
