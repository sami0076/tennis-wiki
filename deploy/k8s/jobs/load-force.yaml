# jobs/load.yaml with the ledger ignored: every file is transferred and re-read
# even if it has not changed since the last ingest.
#
#   kubectl -n deucepoint delete job load-force --ignore-not-found
#   kubectl -n deucepoint apply -f deploy/k8s/jobs/load-force.yaml
#   kubectl -n deucepoint logs -f job/load-force -c ingest
#
# Run this when the database is missing rows that the sources do carry. The
# ordinary ingest asks each source conditionally and skips a 304, so a file
# recorded in the ledger from a run that read a shorter version of it is never
# looked at again -- the season it was mid-way through stays mid-way through
# forever. Nothing else in jobs/ or in the weekly CronJob can break that,
# because none of them passes --force.
#
# It is not the routine tool. Skipping unchanged files is what keeps the weekly
# run to minutes instead of the full hour below, so use load.yaml or the
# schedule unless a file is known or suspected to be stale.
#
# To find out first, count what the database holds by month and look for the
# hole -- empty months in the middle of a season are the symptom:
#
#   SELECT to_char(date_trunc('month', m.played_on), 'YYYY-MM') AS month, count(*)
#     FROM matches m JOIN tournaments t ON t.id = m.tournament_id
#    WHERE t.tour = 'wta' AND t.tier = 'tour' AND m.played_on >= '2025-01-01'
#    GROUP BY 1 ORDER BY 1;
#
# Expect the full load's timings, not the weekly run's: roughly 40 minutes for
# the match stage and 23 for the reference stage on the full dataset, then
# 1m 36s for the ratings (docs/performance.md). Run it after jobs/migrate.yaml.
#
# Forcing everything to fix one tour's season is most of an hour for a few
# files. The ingest takes --tours and --seasons, so narrow it on the way in,
# the same way jobs/reconcile.yaml is narrowed to a dry run:
#
#   sed 's/"--force"/"--force", "--tours", "wta", "--seasons", "2025-2026"/' \
#     deploy/k8s/jobs/load-force.yaml | kubectl -n deucepoint apply -f -
#
# The ratings still run over everything afterwards, which is right: an Elo is
# a walk through every match, so rows added in the middle of 2025 move every
# figure that comes after them.
apiVersion: batch/v1
kind: Job
metadata:
  name: load-force
  namespace: deucepoint
  labels:
    app.kubernetes.io/name: load-force
    app.kubernetes.io/part-of: deucepoint
spec:
  # The ingest records each file only once every row of it has committed, so a
  # retry resumes at the file it died on rather than at the beginning. That is
  # what makes retrying an hour-long job reasonable at all.
  backoffLimit: 2
  # Four hours against a measured hour or so. A Job still running after that is
  # stuck, not slow.
  activeDeadlineSeconds: 14400
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: load-force
        app.kubernetes.io/part-of: deucepoint
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # An init container, so the ratings cannot start against a half-loaded
      # database: Kubernetes runs it to completion first or the pod does not
      # proceed.
      initContainers:
        - name: ingest
          image: ghcr.io/sami0076/tennis-wiki/tools@sha256:49349d72dfc72442f4efb473b3e670f5a043be146b566f962acb60d0d29dfeda
          # Two readers and 500-row batches for the same reason as load.yaml:
          # the default got the process killed for memory pressure and was no
          # faster, the bottleneck being the network. --force is the only
          # difference from that Job, and it is the whole point of this one.
          command: ["ingest", "--force", "--workers", "2", "--batch", "500"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: DATABASE_URL
            # So the finished ingest clears the read cache. Without this the
            # ingest still works and the site serves yesterday's answers until
            # the 24-hour TTL expires them.
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: api
                  key: REDIS_URL
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              # Bounded, unlike the serving path: this is batch work that runs
              # for an hour next to a Postgres that the site is depending on.
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: rate
          image: ghcr.io/sami0076/tennis-wiki/tools@sha256:49349d72dfc72442f4efb473b3e670f5a043be146b566f962acb60d0d29dfeda
          command: ["rate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: DATABASE_URL
            # So the finished ratings clear the read cache too. The ingest's
            # flush runs before these are written, so without this a rerun
            # leaves every /rankings answer stale until the 24-hour TTL.
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: api
                  key: REDIS_URL
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        # The root filesystem is read-only, so anything wanting a scratch file
        # gets this and loses it with the pod.
        - name: tmp
          emptyDir: {}
