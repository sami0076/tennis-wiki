# This week's results so far: the source's ongoing files, hourly (ADR-0016).
# Provisional, kept in ongoing_matches and never in matches; the weekly load
# brings each finished event in from its season file. An unchanged file costs
# one 304, and /this-week is uncached, so nothing is flushed.
#
#   kubectl -n deucepoint get cronjob ongoing-hourly
#   kubectl -n deucepoint create job --from=cronjob/ongoing-hourly ongoing-now
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ongoing-hourly
  namespace: deucepoint
  labels:
    app.kubernetes.io/name: ongoing-hourly
    app.kubernetes.io/part-of: deucepoint
spec:
  suspend: false
  schedule: "7 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  # A missed hour is covered by the next one.
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ongoing-hourly
            app.kubernetes.io/part-of: deucepoint
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: ongoing
              image: ghcr.io/sami0076/tennis-wiki/tools@sha256:3e23b6da56815b5a449718e493be0c526f492fca2ec5a1d33cf7839de1033737
              command: ["ongoing"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: postgres
                      key: DATABASE_URL
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
