apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: deucepoint
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: deucepoint
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: deucepoint
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: deucepoint
spec:
  # Two on one node is not high availability, it is a rollout that nobody
  # watching the site notices, and a crashed pod that does not take the site
  # with it while it restarts.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: deucepoint
    spec:
      # Config says 20s for the shutdown timeout, so the grace period has to be
      # longer than that or Kubernetes kills the drain it asked for.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Pinned by digest, from the images job in ci.yml. A tag can be
          # repointed; this cannot, so what is running is answerable from the
          # manifest alone. deploy/k8s/README.md says how to move it.
          image: ghcr.io/sami0076/tennis-wiki/api@sha256:4e321b5103fb72bf14fba684a925a28a61958e15abe08a30c714c5018d0f68f3
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: api
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: DATABASE_URL
          # Readiness round-trips a query, so a pod pointed at an unmigrated or
          # unreachable database takes itself out of rotation instead of
          # serving 500s.
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Liveness touches nothing. The same probe on /health would turn a
          # five-second Postgres hiccup into a restart of every pod, at the
          # moment the database can least afford the reconnections.
          livenessProbe:
            httpGet:
              path: /api/v1/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 192Mi
            limits:
              # No CPU limit: the uncached numbers in docs/performance.md are
              # what a first visitor after a restart waits through, and
              # throttling them to a quota on an otherwise idle node makes that
              # worse for no one's benefit. Memory is limited because memory is
              # the resource that cannot be given back under pressure.
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
# So draining the node for a kernel update does not take both pods at once.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: deucepoint
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: deucepoint
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
