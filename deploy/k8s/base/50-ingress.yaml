# Prerequisite, installed once per cluster and not by this directory:
# cert-manager. #101 does that; these objects assume it is already there.
#
# k3s ships Traefik as its ingress controller, so the ingressClassName and the
# middleware below are Traefik's.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # Let's Encrypt sends expiry warnings here. Fill it in before applying --
    # a certificate nobody is told about is one that silently lapses.
    email: REPLACE_ME
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
# HTTP exists only to send people to HTTPS.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: deucepoint
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# Two Ingresses rather than one with both entrypoints, so the redirect can be
# attached to the plaintext router alone. Attaching it to a router that is
# already serving HTTPS is how a redirect becomes a loop.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-http-redirect
  namespace: deucepoint
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: deucepoint
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: deucepoint-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    # The placeholder from 10-config.yaml. Both files name the host, and both
    # have to change together when #101 picks the real one.
    - host: api.deucepoint.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: deucepoint
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: deucepoint
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - api.deucepoint.example
      # cert-manager creates and renews this; nothing applies it by hand.
      secretName: api-tls
  rules:
    - host: api.deucepoint.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
