# Copy to secrets.yaml, fill in a generated password, apply it, and do not
# commit it -- .gitignore ignores secrets.yaml and makes an exception only for
# this file.
#
#   kubectl apply -f secrets.yaml
#
# The password appears twice because it has two consumers that cannot share a
# representation: Postgres wants it alone, the API wants it inside a URL.
# Generate one with:
#
#   LC_ALL=C tr -dc 'A-Za-z0-9' </dev/urandom | head -c 32
#
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: deucepoint
  labels:
    app.kubernetes.io/part-of: deucepoint
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_ME"

  # sslmode=disable is correct here and only here: this crosses a pod network
  # on one node and never leaves the host. The API image ships CA certificates
  # for the deployments where that stops being true.
  DATABASE_URL: "postgres://tennis:REPLACE_ME@postgres:5432/tennis?sslmode=disable"
