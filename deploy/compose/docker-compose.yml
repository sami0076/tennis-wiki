services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tennis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tennis}
      POSTGRES_DB: ${POSTGRES_DB:-tennis}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Docker gives a container 64MB of /dev/shm, which Postgres uses for
    # parallel query workers. At 1.6M matches the data-quality report failed
    # with "could not resize shared memory segment: No space left on device".
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tennis} -d ${POSTGRES_DB:-tennis}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    command:
      # A full ingest writes ~1.6M matches. These make that bearable locally;
      # they are not production settings.
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - synchronous_commit=off

  # The application services. `make up` starts only postgres and redis, which
  # is the fast loop for working on the Go side; `docker compose up` builds and
  # runs the whole site.
  api:
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tennis}:${POSTGRES_PASSWORD:-tennis}@postgres:5432/${POSTGRES_DB:-tennis}?sslmode=disable
      API_ADDR: ":8080"
      # The frontend is served from the same origin through nginx, so the only
      # cross-origin caller is the Vite dev server.
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ../../web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5174}:80"
    depends_on:
      api:
        condition: service_started

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    # No persistence: everything here is a cache rebuilt from Postgres.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
