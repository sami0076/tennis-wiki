version: "2"

linters:
  # Build-spec section 4.1 requires these four. Others are opt-in later
  # rather than enabled wholesale, so every warning stays worth reading.
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      # shadow is deliberately not enabled: it flags `if err := f(); err != nil`,
      # which is idiomatic Go, and is excluded from the default vet suite for
      # that reason.
      enable-all: false
    revive:
      rules:
        - name: exported
        - name: error-strings
        - name: error-return
        - name: context-as-argument
        - name: indent-error-flow

  exclusions:
    generated: lax
    # sqlc output carries the standard "Code generated ... DO NOT EDIT" header,
    # so `generated: lax` above already skips it. Excluding internal/db by path
    # would also stop linting the hand-written pool that lives beside it.
    rules:
      # Table-driven tests routinely ignore errors that matter in production.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/sami0076/tennis-wiki

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
