server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API is same-origin in the browser, which is what makes the built
    # frontend behave like the dev server does: one origin, no CORS, and the
    # client's /api/v1 paths work unchanged in both.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing: every unknown path is a route, not a missing file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset names, so they can be cached hard. index.html cannot.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
