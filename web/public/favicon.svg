<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Deucepoint">
  <!--
    The site's brand mark: the ink dot that sits before the wordmark in the
    header. A tab is 16px, so the mark is the dot alone, because a letter or a
    racquet at that size is a smudge.

    The colours follow the reader's system theme the way the site does. An SVG
    favicon is re-read when the scheme changes, so this needs no second file.
  -->
  <style>
    .ground { fill: #f6f6f2; }
    .ink    { fill: #17181a; }
    @media (prefers-color-scheme: dark) {
      .ground { fill: #121311; }
      .ink    { fill: #f3f2ea; }
    }
  </style>
  <rect class="ground" width="32" height="32" rx="7" />
  <circle class="ink" cx="16" cy="16" r="7" />
</svg>
