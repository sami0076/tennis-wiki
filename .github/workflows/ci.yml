name: CI

on:
  push:
    branches: [main]
    # A release tag republishes the images under a semver tag. Everything the
    # images job waits on runs again for it, which is the point.
    tags: ['v*']
  # No branch filter: a pull request stacked on another feature branch needs
  # checking too, and filtering on main silently gave those no checks at all.
  pull_request:

# A newer push makes the previous run's verdict worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Whether this change touches the frontend at all. The Go jobs stay
  # unconditional -- they are the ones that can break the API -- but a Go-only
  # pull request should not wait on npm install.
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      images: ${{ steps.images.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'web/**'
              - '.github/workflows/**'
            api:
              - 'cmd/**'
              - 'internal/**'
              - 'go.mod'
              - 'go.sum'
              - 'deploy/docker/api.Dockerfile'
              - '.dockerignore'
              - '.github/workflows/**'
            # The tools image carries the migrations and the source registry,
            # so a migration or a configs/ edit changes it and nothing else.
            tools:
              - 'cmd/**'
              - 'internal/**'
              - 'migrations/**'
              - 'configs/**'
              - 'go.mod'
              - 'go.sum'
              - 'deploy/docker/tools.Dockerfile'
              - '.dockerignore'
              - '.github/workflows/**'

      # Which images the push actually needs, as the matrix for the job below.
      # A tag builds all three regardless of the diff: a release names a
      # commit, not a change.
      - id: images
        run: |
          if ${{ startsWith(github.ref, 'refs/tags/') }}; then
            names='api tools web'
          else
            names=''
            if [ '${{ steps.filter.outputs.api }}' = 'true' ]; then names="$names api"; fi
            if [ '${{ steps.filter.outputs.tools }}' = 'true' ]; then names="$names tools"; fi
            if [ '${{ steps.filter.outputs.web }}' = 'true' ]; then names="$names web"; fi
          fi
          matrix=$(jq -cn --arg names "$names" '$names | split(" ") | map(select(length > 0))')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "images to build: $matrix"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The version is pinned in the Makefile so local runs and CI agree.
      - id: version
        run: echo "golangci=$(make -s print-GOLANGCI_VERSION)" >> "$GITHUB_OUTPUT"

      # govet is enabled in .golangci.yml, so this covers go vet as well.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.version.outputs.golangci }}

  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go mod verify

      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: make build

      # No service container: the integration tests start their own Postgres
      # per package through testcontainers, which is what keeps them from
      # contending over one database. Runners have Docker.
      - run: make test-race

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: tennis
          POSTGRES_PASSWORD: tennis
          POSTGRES_DB: tennis
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U tennis -d tennis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Reapplying after a full rollback is the only thing that exercises the
      # down steps, which nothing else runs.
      - name: apply, roll back, reapply
        env:
          GOTOOLCHAIN: auto
        run: |
          make migrate-up
          make migrate-reset
          make migrate-up

      # Every data-quality query runs against the fresh schema, so a migration
      # that has drifted from the code fails here rather than in production.
      - run: make dataqual

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # One install, then each check as its own step so a failure names itself
      # rather than being "the frontend job".
      - run: npm ci
      - name: tsc
        run: npm run typecheck
      - name: eslint
        run: npm run lint
      - name: vitest
        run: npm run test
      - name: build
        run: npm run build

  # Deliberately not gated on web/ changing: it is a change to a Go response
  # struct that makes the generated types stale, and that change touches no
  # file under web/. Running this everywhere is what turns a shape change into
  # a failed check rather than a runtime surprise in the browser.
  web-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: regenerate the API types
        run: make web-types

      - name: web/src/api/types.gen.ts is up to date with the Go structs
        run: git diff --exit-code -- web/src/api/types.gen.ts

  # Same discipline, one document along: the methodology page is generated from
  # docs/methodology.md and the committed validation run, and editing either
  # without regenerating would leave the site quoting numbers the repository no
  # longer holds. Not gated on web/ for the same reason as the job above -- the
  # edit that makes this stale is a change to docs/.
  methodology:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Fails on its own if the prose and docs/validation.json disagree, before
      # it writes anything.
      - name: regenerate the methodology page
        run: npm run methodology

      - name: web/src/generated/methodology.ts is up to date with the document
        run: git diff --exit-code -- src/generated/methodology.ts

  # Publishing, on main and on tags only. A pull request has no business
  # writing to the registry, and there is nothing to pull an image with until
  # the change has landed.
  #
  # linux/amd64 and nothing else, per ADR-0008: the host is a Hetzner CX33,
  # which is Intel, so a second architecture would be build time spent on an
  # image nobody pulls.
  images:
    needs: [changes, lint, tidy, test, migrations, web, web-types, methodology]
    # The web job is conditional, and an ordinary `needs` on a skipped job
    # would skip this one too. So: run unless something actually failed.
    if: >-
      !cancelled()
      && !contains(needs.*.result, 'failure')
      && github.event_name == 'push'
      && needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v7

      # From the Makefile, the same way the lint job reads its golangci pin.
      - id: version
        run: echo "goose=$(make -s print-GOOSE_VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No `latest`. A manifest that names it cannot say what is running and
      # cannot be rolled back; the short SHA is immutable and the semver tag
      # only appears on a release.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=sha,format=short,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        id: build
        with:
          # The frontend builds from web/; the two Go images need the
          # repository root, which .dockerignore keeps to a few megabytes.
          context: ${{ matrix.image == 'web' && 'web' || '.' }}
          file: ${{ matrix.image == 'web' && 'web/Dockerfile' || format('deploy/docker/{0}.Dockerfile', matrix.image) }}
          build-args: ${{ matrix.image == 'tools' && format('GOOSE_VERSION={0}', steps.version.outputs.goose) || '' }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Off so the digest below names the image itself rather than an
          # index wrapping it and an attestation. The manifests in #100 pin
          # by that digest.
          provenance: false
          # Keyed per image, so the API build does not evict the frontend's
          # node_modules layer and start every run with a cold go mod download.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # The digest is what a manifest pins to, and the size is the number
      # docs/performance.md records. Both belong somewhere a run can be read.
      - name: digest and size
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REF: ghcr.io/${{ github.repository }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: |
          bytes=$(docker buildx imagetools inspect "$REF" --raw | jq '[.layers[].size] | add')
          {
            echo "### ${{ matrix.image }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| digest | $DIGEST |"
            echo "| compressed | $(( bytes / 1000000 )) MB |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
