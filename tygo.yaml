# TypeScript types are generated from the Go response structs, not written by
# hand, so a change to a handler's shape is a compile error in web/ rather than
# a runtime surprise. Same discipline as sqlc: generate, check in, and let CI
# fail if the checked-in file is stale.
packages:
  - path: "github.com/sami0076/tennis-wiki/internal/httpapi"
    output_path: "web/src/api/types.gen.ts"
    # Only the files that define what the API returns. The rest of the package
    # is middleware, config and routing, none of which crosses the wire.
    include_files:
      - "players.go"
      - "matches.go"
      - "ratings.go"
      - "rankings.go"
      - "trajectory.go"
      - "h2h.go"
      - "clutch.go"
      - "coverage.go"
      - "problem.go"
      - "cursor.go"
    type_mappings:
      time.Time: "string"
    # A nil Go pointer without omitempty marshals to JSON null, not to an absent
    # key. "null" makes the generated type say that, so `career: Career | null`
    # forces a check instead of `career?: Career` quietly describing a shape the
    # API never sends. Absence is the whole point of this data model.
    optional_type: "null"
    frontmatter: |
      /* eslint-disable */
      // Code generated by tygo from internal/httpapi. DO NOT EDIT.
      //
      // Regenerate with `make web-types`. CI fails if this file is out of date
      // with the Go structs it came from.

      /** A Go [2]T. Everything the head-to-head pairs is in the order the URL asked for. */
      export type Pair<T> = [T, T]
