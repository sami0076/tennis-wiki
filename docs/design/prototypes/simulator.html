<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulator page — design reference prototype</title>
<!--
DESIGN REFERENCE PROTOTYPE — docs/design/prototypes/simulator.html

What this is
  A self-contained, working prototype of the simulator page: player/surface/format
  selection, the closed-form simulation with staged reveal, and "watch a simulated
  match" playback with a live scoreboard and stats tracker.

What is AUTHORITATIVE in this file (build to match):
  - The math. game(), the tiebreak recursion with the 6-6 closed form, the set
    recursion, and the best-of-N binomial are spec §8 exactly. With inputs
    spw .72/.68, rpw .43/.45, rpw_avg .38, bo5, this produces the §8.6 golden
    values (match 62.2%). The sampling functions (sampleGame/sampleTB/buildMatch)
    are the reference for the playback feature.
  - The animation sequence and timings: win bar eases from 50/50 with count-up
    (~700ms) -> buildup rows reveal top to bottom -> scoreline bars grow.
    Playback pacing: routine hold ~480ms, break point beat 850ms, break 950ms,
    tiebreak ~1000-1100ms, set end 1300ms. prefers-reduced-motion collapses
    everything to instant render.
  - The scoreboard and tracker design: per-set columns, current set on the surface
    wash, tiebreak superscript (7^6), pulsing serve dot in the surface color,
    break flash on the broken player's row, number pop on game ticks. Tracker
    tallies (points / break points won / holds) come from the actual sampled
    points, never invented.
  - The copy: "One simulated match", "a single draw from the odds above",
    sentence case throughout. Never label the playback a prediction.
  - Color rules: hue = surface only (dot, wash, flash, toggle). Players are
    always ink #14161A vs gray #9A9DA1.

What is PLACEHOLDER (do not ship):
  - The player roster and every spw/rpw number in P and AVG. Real values come
    from the stats pipeline per player per surface.
  - This JS itself. The engine ports to Go (internal/simulate) per the spec;
    the page re-implements in React + CSS Modules per docs/design/frontend-handoff.md.
    This file exists so you can SEE and INTERACT with the target, not to be copied in.

Tokens and structure follow docs/design/frontend-handoff.md.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&display=swap">
<style>
html,body{margin:0;padding:0;background:#F7F7F5;}
.page{max-width:400px;margin:24px auto;padding:0 8px;}
.rv{opacity:0;transform:translateY(6px);transition:opacity .45s ease,transform .45s ease}
.res.on .rv{opacity:1;transform:translateY(0)}
.ba{transition:width .7s cubic-bezier(.25,.7,.25,1)}
.sb{width:0;transition:width .55s cubic-bezier(.25,.7,.25,1)}
.cm{transition:opacity .22s ease}
.pf{transition:width .5s cubic-bezier(.25,.7,.25,1)}
.stog{background:none;border:none;padding:0 0 3px;font:600 12px 'Archivo',sans-serif;color:#6E7175;border-bottom:2px solid transparent;border-radius:0;cursor:pointer}
.psel{width:100%;appearance:none;-webkit-appearance:none;background:#FFFFFF;border:1px solid #E2E2DD;border-radius:4px;padding:9px 10px;font:600 14px 'Archivo',sans-serif;color:#14161A}
.act{width:100%;background:none;border:1px solid #14161A;border-radius:4px;padding:10px;font:600 14px 'Archivo',sans-serif;color:#14161A;cursor:pointer}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px;animation:pu 1.2s ease-in-out infinite}
.pop{display:inline-block;animation:pp .35s ease-out}
.flashrow{animation:fl .9s ease-out}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes pp{0%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes fl{0%{background:var(--wash)}100%{background:transparent}}
@media (prefers-reduced-motion: reduce){.rv,.ba,.sb,.cm,.pf{transition:none!important}.dot,.pop,.flashrow{animation:none!important}}
</style>
</head>
<body>
<div class="page">
<div style="background:#F7F7F5;color:#14161A;border:1px solid #E2E2DD;border-radius:8px;overflow:hidden;font-family:'Archivo',-apple-system,sans-serif;">

  <div style="padding:16px;border-bottom:1px solid #E2E2DD;">
    <h1 style="margin:0 0 2px;font-size:20px;font-weight:700;">Simulator</h1>
    <p style="margin:0;font-size:12px;color:#6E7175;">Point to match, solved in closed form</p>
  </div>

  <div style="padding:16px;border-bottom:1px solid #E2E2DD;">
    <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:14px;">
      <select id="pa" class="psel" aria-label="Player A"><option value="alcaraz" selected>Alcaraz</option><option value="sinner">Sinner</option><option value="zverev">Zverev</option><option value="musetti">Musetti</option><option value="fonseca">Fonseca</option><option value="rune">Rune</option></select>
      <span style="font-size:12px;color:#6E7175;">vs</span>
      <select id="pb" class="psel" aria-label="Player B"><option value="alcaraz">Alcaraz</option><option value="sinner" selected>Sinner</option><option value="zverev">Zverev</option><option value="musetti">Musetti</option><option value="fonseca">Fonseca</option><option value="rune">Rune</option></select>
    </div>
    <div style="display:flex;gap:16px;align-items:center;margin-bottom:14px;">
      <button class="stog" id="s-hard">Hard</button>
      <button class="stog" id="s-clay">Clay</button>
      <button class="stog" id="s-grass">Grass</button>
      <span style="flex:1;"></span>
      <button class="stog" id="b3">Best of 3</button>
      <button class="stog" id="b5">Best of 5</button>
    </div>
    <button id="run" class="act">Run simulation</button>
  </div>

  <div id="res" class="res" style="display:none;">
    <div style="padding:16px;border-bottom:1px solid #E2E2DD;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">
        <span style="font-size:15px;font-weight:700;"><span id="na">Alcaraz</span> <span id="va" style="font-size:22px;font-variant-numeric:tabular-nums;">50.0%</span></span>
        <span style="font-size:15px;font-weight:700;color:#6E7175;"><span id="vb" style="font-size:22px;font-variant-numeric:tabular-nums;">50.0%</span> <span id="nb">Sinner</span></span>
      </div>
      <div style="display:flex;height:8px;">
        <div id="barA" class="ba" style="width:50%;background:#14161A;"></div>
        <div style="width:1px;background:#F7F7F5;"></div>
        <div style="flex:1;background:#9A9DA1;"></div>
      </div>
    </div>
    <div style="padding:14px 16px;border-bottom:1px solid #E2E2DD;font-variant-numeric:tabular-nums;">
      <div style="border-left:2px solid #E2E2DD;padding-left:14px;">
        <div class="rv" style="padding:4px 0;font-size:13px;display:flex;justify-content:space-between;transition-delay:.2s;"><span>Point, on serve</span><b id="r1"></b></div>
        <div class="rv" style="padding:4px 0;font-size:13px;display:flex;justify-content:space-between;transition-delay:.35s;"><span>Hold</span><b id="r2"></b></div>
        <div class="rv" style="padding:4px 0;font-size:13px;display:flex;justify-content:space-between;transition-delay:.5s;"><span>Set</span><b id="r3"></b></div>
        <div class="rv" style="padding:4px 0;font-size:13px;display:flex;justify-content:space-between;transition-delay:.65s;"><span>Match</span><b id="r4"></b></div>
      </div>
    </div>
    <div style="padding:12px 16px;border-bottom:1px solid #E2E2DD;font-variant-numeric:tabular-nums;">
      <div class="rv" style="transition-delay:.2s;" id="lines"></div>
    </div>

    <div id="pb-wrap" style="padding:14px 16px;">
      <p style="margin:0 0 10px;font-size:12px;color:#6E7175;">One simulated match · a single draw from the odds above</p>
      <div id="board" style="background:#FFFFFF;border:1px solid #E2E2DD;border-radius:4px;padding:4px 12px;margin-bottom:8px;display:none;"></div>
      <p id="comm" class="cm" style="margin:0 0 12px;font-size:13px;color:#6E7175;min-height:20px;"></p>
      <div id="stats" style="display:none;border-top:1px solid #E2E2DD;padding-top:12px;margin-bottom:14px;font-variant-numeric:tabular-nums;">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;">
          <b id="ptA">0</b><span style="color:#6E7175;">points won</span><b id="ptB" style="color:#6E7175;">0</b>
        </div>
        <div style="display:flex;height:6px;margin-bottom:12px;">
          <div style="flex:1;display:flex;justify-content:flex-end;"><div id="pfA" class="pf" style="width:0%;height:100%;background:#14161A;"></div></div>
          <div style="width:1px;background:#F7F7F5;"></div>
          <div style="flex:1;"><div id="pfB" class="pf" style="width:0%;height:100%;background:#9A9DA1;"></div></div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0;">
          <b id="bpA">0 of 0</b><span style="color:#6E7175;">break points won</span><b id="bpB" style="color:#6E7175;">0 of 0</b>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0;">
          <b id="hA">0</b><span style="color:#6E7175;">service holds</span><b id="hB" style="color:#6E7175;">0</b>
        </div>
      </div>
      <button id="watch" class="act">Watch a simulated match</button>
    </div>
  </div>
</div>
</div>
<script>
(function(){
var P={alcaraz:{hard:[.70,.42],clay:[.72,.43],grass:[.71,.41]},sinner:{hard:[.73,.44],clay:[.68,.45],grass:[.71,.42]},zverev:{hard:[.70,.38],clay:[.69,.39],grass:[.68,.37]},musetti:{hard:[.65,.39],clay:[.69,.41],grass:[.64,.38]},fonseca:{hard:[.68,.39],clay:[.69,.40],grass:[.66,.37]},rune:{hard:[.67,.40],clay:[.68,.41],grass:[.66,.38]}};
var AVG={hard:.365,clay:.38,grass:.35},SC={hard:"#2E6FA8",clay:"#C4622D",grass:"#4A7A3F"},WASH={hard:"#EAF1F8",clay:"#FAF0E9",grass:"#EDF3EA"};
var surface="clay",bo=5,fA=0,fB=0,NA="Alcaraz",NB="Sinner",ran=false,playing=false;
var reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function pct(x){return (100*x).toFixed(1);}
function game(p){var q=1-p;return Math.pow(p,4)*(1+4*q+10*q*q)+20*Math.pow(p,3)*Math.pow(q,3)*(p*p/(p*p+q*q));}
function solve(a,b){
  var gA=game(a),gB=game(b),tbm={},stm={};
  function tb(x,y){var k=x+","+y;if(k in tbm)return tbm[k];var v;
    if(x===6&&y===6){var w=a*(1-b),l=(1-a)*b;v=w/(w+l);}
    else if(x>=7&&x-y>=2)v=1;else if(y>=7&&y-x>=2)v=0;
    else{var n=x+y,sA=Math.floor((n+1)/2)%2===0,p=sA?a:1-b;v=p*tb(x+1,y)+(1-p)*tb(x,y+1);}
    tbm[k]=v;return v;}
  function st(x,y,s){var k=x+","+y+","+s;if(k in stm)return stm[k];var v;
    if(x===6&&y===6)v=tb(0,0);
    else if(x>=6&&x-y>=2)v=1;else if(y>=6&&y-x>=2)v=0;
    else{var g=s===0?gA:1-gB;v=g*st(x+1,y,1-s)+(1-g)*st(x,y+1,1-s);}
    stm[k]=v;return v;}
  return {gA:gA,gB:gB,set:st(0,0,0)};
}
function setTog(){["hard","clay","grass"].forEach(function(s){var el=document.getElementById("s-"+s);var on=s===surface;el.style.color=on?SC[s]:"#6E7175";el.style.borderBottomColor=on?SC[s]:"transparent";});
  [[3,"b3"],[5,"b5"]].forEach(function(x){var el=document.getElementById(x[1]);var on=bo===x[0];el.style.color=on?"#14161A":"#6E7175";el.style.borderBottomColor=on?"#14161A":"transparent";});}
["hard","clay","grass"].forEach(function(s){document.getElementById("s-"+s).onclick=function(){surface=s;setTog();};});
document.getElementById("b3").onclick=function(){bo=3;setTog();};
document.getElementById("b5").onclick=function(){bo=5;setTog();};
setTog();
function count(el,to,ms){if(reduced){el.textContent=to.toFixed(1)+"%";return;}
  var t0=null;function step(t){if(!t0)t0=t;var f=Math.min(1,(t-t0)/ms);f=1-Math.pow(1-f,3);el.textContent=(50+(to-50)*f).toFixed(1)+"%";if(f<1)requestAnimationFrame(step);}requestAnimationFrame(step);}
document.getElementById("run").onclick=function(){
  if(playing)return;
  var a=document.getElementById("pa").value,b=document.getElementById("pb").value;
  NA=cap(a);NB=cap(b);
  var pa=P[a][surface],pb=P[b][surface],avg=AVG[surface];
  fA=Math.min(.85,Math.max(.30,pa[0]-pb[1]+avg));fB=Math.min(.85,Math.max(.30,pb[0]-pa[1]+avg));
  var r=solve(fA,fB),s=r.set,q=1-s,m,dist;
  if(bo===5){m=s*s*s*(1+3*q+6*q*q);dist=[["3–0",s*s*s,1],["3–1",3*s*s*s*q,1],["3–2",6*s*s*s*q*q,1],["2–3",6*q*q*q*s*s,0],["1–3",3*q*q*q*s,0],["0–3",q*q*q,0]];}
  else{m=s*s*(1+2*q);dist=[["2–0",s*s,1],["2–1",2*s*s*q,1],["1–2",2*q*q*s,0],["0–2",q*q,0]];}
  dist.sort(function(x,y){return y[1]-x[1];});
  document.getElementById("na").textContent=NA;document.getElementById("nb").textContent=NB;
  document.getElementById("r1").textContent=pct(fA)+" · "+pct(fB);
  document.getElementById("r2").textContent=pct(r.gA)+" · "+pct(r.gB);
  document.getElementById("r3").textContent=pct(s)+" · "+pct(q);
  document.getElementById("r4").textContent=pct(m)+" · "+pct(1-m);
  var mx=Math.max.apply(null,dist.map(function(d){return d[1];}));
  document.getElementById("lines").innerHTML=dist.map(function(d){
    return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;"><span style="font-size:13px;width:32px;">'+d[0]+'</span><div style="flex:1;height:6px;"><div class="sb" data-w="'+(96*d[1]/mx)+'" style="height:100%;background:'+(d[2]?"#14161A":"#9A9DA1")+';"></div></div><span style="font-size:13px;width:44px;text-align:right;">'+pct(d[1])+'%</span></div>';}).join("");
  document.getElementById("board").style.display="none";document.getElementById("stats").style.display="none";
  document.getElementById("comm").textContent="";document.getElementById("watch").textContent="Watch a simulated match";
  document.getElementById("pb-wrap").style.setProperty("--wash",WASH[surface]);
  var res=document.getElementById("res");
  res.classList.remove("on");res.style.display="block";
  document.getElementById("barA").style.width="50%";
  document.querySelectorAll(".sb").forEach(function(e){e.style.width="0";});
  void res.offsetWidth;ran=true;
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    res.classList.add("on");
    document.getElementById("barA").style.width=(100*m)+"%";
    count(document.getElementById("va"),100*m,700);count(document.getElementById("vb"),100*(1-m),700);
    setTimeout(function(){document.querySelectorAll(".sb").forEach(function(e){e.style.width=e.getAttribute("data-w")+"%";});},reduced?0:300);
  });});
};
function sampleGame(fs){var sp=0,rp=0,bp=0;
  while(!(sp>=4&&sp-rp>=2)&&!(rp>=4&&rp-sp>=2)){if(rp>=3&&rp>sp)bp++;if(Math.random()<fs)sp++;else rp++;}
  return {hold:sp>rp,bp:bp,sp:sp,rp:rp};}
function sampleTB(){var x=0,y=0;
  while(!((x>=7||y>=7)&&Math.abs(x-y)>=2)&&x+y<40){var n=x+y,sA=Math.floor((n+1)/2)%2===0,p=sA?fA:1-fB;if(Math.random()<p)x++;else y++;}
  return [x,y];}
function buildMatch(){
  var ev=[],need=(bo+1)/2,srv=0;
  var st={sets:[],cur:{a:0,b:0,tbA:null,tbB:null},sA:0,sB:0,pA:0,pB:0,bcA:0,boA:0,bcB:0,boB:0,hA:0,hB:0,srv:0,flash:null,pop:null};
  function snap(){return JSON.parse(JSON.stringify(st));}
  var holdTxt=[" holds serve"," holds comfortably"," holds to stay in front"," holds from deuce"];
  while(st.sA<need&&st.sB<need){
    var setN=st.sets.length+1,done=false;
    st.cur={a:0,b:0,tbA:null,tbB:null};
    while(!done){
      st.srv=srv;st.flash=null;st.pop=null;
      if(st.cur.a===6&&st.cur.b===6){
        ev.push({c:"Tiebreak at 6–6",d:1000,snap:snap()});
        var t=sampleTB();var aw=t[0]>t[1];
        st.pA+=t[0];st.pB+=t[1];
        if(aw){st.cur.a=7;st.cur.tbB=t[1];}else{st.cur.b=7;st.cur.tbA=t[0];}
        st.pop=aw?"a":"b";
        ev.push({c:(aw?NA:NB)+" takes the tiebreak "+Math.max(t[0],t[1])+"–"+Math.min(t[0],t[1]),d:1100,snap:snap()});
        done=true;
      } else {
        var svA=srv===0,g=sampleGame(svA?fA:fB);
        var srvName=svA?NA:NB,rtName=svA?NB:NA;
        if(svA){st.pA+=g.sp;st.pB+=g.rp;}else{st.pB+=g.sp;st.pA+=g.rp;}
        if(g.bp>0){if(svA)st.boB+=g.bp;else st.boA+=g.bp;
          ev.push({c:"Break point, "+rtName,d:850,snap:snap()});}
        if(g.hold){if(svA){st.cur.a++;st.hA++;st.pop="a";}else{st.cur.b++;st.hB++;st.pop="b";}
          ev.push({c:srvName+holdTxt[Math.floor(Math.random()*holdTxt.length)],d:g.bp?800:480,snap:snap()});}
        else{if(svA){st.cur.b++;st.bcB++;st.pop="b";st.flash="b";}else{st.cur.a++;st.bcA++;st.pop="a";st.flash="a";}
          ev.push({c:rtName+" breaks",d:950,snap:snap()});}
        srv=1-srv;
        if((st.cur.a>=6&&st.cur.a-st.cur.b>=2)||(st.cur.b>=6&&st.cur.b-st.cur.a>=2))done=true;
      }
    }
    var aWon=st.cur.a>st.cur.b;if(aWon)st.sA++;else st.sB++;
    st.sets.push({a:st.cur.a,b:st.cur.b,tbA:st.cur.tbA,tbB:st.cur.tbB,w:aWon});
    st.cur=null;st.flash=null;st.pop=null;
    ev.push({c:"Set "+setN+" to "+(aWon?NA:NB),d:1300,snap:snap()});
    st.cur={a:0,b:0,tbA:null,tbB:null};
  }
  st.cur=null;
  var aM=st.sA>st.sB;
  ev.push({c:"Game, set, match — "+(aM?NA:NB)+" wins "+(aM?st.sA+"–"+st.sB:st.sB+"–"+st.sA),d:0,snap:snap(),end:true});
  return ev;
}
function cell(v,tb,strong,curCol,popped){
  var s='padding:7px 0;text-align:center;width:30px;font-size:16px;font-weight:700;color:'+(strong?"#14161A":"#9A9DA1")+';'+(curCol?'background:var(--wash);':'');
  var inner=(popped?'<span class="pop">':'<span>')+v+(tb!==null&&tb!==undefined?'<sup style="font-size:10px;font-weight:600;">'+tb+'</sup>':'')+'</span>';
  return '<td style="'+s+'">'+inner+'</td>';
}
function renderBoard(s){
  var n=s.sets.length+(s.cur?1:0),head='<tr><td style="padding:2px 0;"></td>';
  for(var i=1;i<=n;i++)head+='<td style="text-align:center;font-size:10px;color:#6E7175;padding:2px 0;">'+i+'</td>';
  head+='</tr>';
  function row(who){
    var name=who==="a"?NA:NB,lead=who==="a"?s.sA>=s.sB:s.sB>=s.sA;
    var h='<tr'+(s.flash===who?' class="flashrow"':'')+'><td style="padding:7px 0;font-size:14px;font-weight:700;color:'+(lead?"#14161A":"#6E7175")+';">'
      +(s.cur&&((s.srv===0&&who==="a")||(s.srv===1&&who==="b"))?'<span class="dot" style="background:'+SC[surface]+';"></span>':'<span style="display:inline-block;width:14px;"></span>')
      +name+'</td>';
    for(var i=0;i<s.sets.length;i++){var t=s.sets[i];
      h+=cell(who==="a"?t.a:t.b, who==="a"?t.tbA:t.tbB, who==="a"?t.w:!t.w, false, false);}
    if(s.cur)h+=cell(who==="a"?s.cur.a:s.cur.b, null, true, true, s.pop===who);
    return h+'</tr>';
  }
  document.getElementById("board").innerHTML='<table style="width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;">'+head+row("a")+row("b")+'</table>';
}
function updStats(s){
  document.getElementById("ptA").textContent=s.pA;document.getElementById("ptB").textContent=s.pB;
  var tot=Math.max(1,s.pA+s.pB);
  document.getElementById("pfA").style.width=(100*s.pA/tot)+"%";
  document.getElementById("pfB").style.width=(100*s.pB/tot)+"%";
  document.getElementById("bpA").textContent=s.bcA+" of "+s.boA;
  document.getElementById("bpB").textContent=s.bcB+" of "+s.boB;
  document.getElementById("hA").textContent=s.hA;document.getElementById("hB").textContent=s.hB;
}
document.getElementById("watch").onclick=function(){
  if(!ran||playing)return;
  playing=true;
  var ev=buildMatch(),btn=document.getElementById("watch"),comm=document.getElementById("comm");
  document.getElementById("board").style.display="block";
  document.getElementById("stats").style.display="block";
  btn.textContent="Playing…";
  if(reduced){var last=ev[ev.length-1];renderBoard(last.snap);updStats(last.snap);comm.textContent=last.c;btn.textContent="Watch another";playing=false;return;}
  var i=0;
  function step(){
    if(i>=ev.length){playing=false;btn.textContent="Watch another";return;}
    var e=ev[i];
    comm.style.opacity="0";
    setTimeout(function(){
      comm.textContent=e.c;comm.style.opacity="1";
      renderBoard(e.snap);updStats(e.snap);
      i++;
      if(e.end){playing=false;btn.textContent="Watch another";return;}
      setTimeout(step,e.d);
    },200);
  }
  step();
};
})();
</script>
</body>
